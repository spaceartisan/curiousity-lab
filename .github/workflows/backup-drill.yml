name: Synthetic monthly backup recovery drill
on:
  schedule:
    - cron: "23 9 1 * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: synthetic-backup-drill
  cancel-in-progress: false
jobs:
  synthetic-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - run: sudo apt-get update && sudo apt-get install -y age
      - run: npm ci
      - run: npm run test:backup
      - run: npm run test:rules
# Only fictional fixtures and ephemeral keys. No production credentials,
# Firebase access, private archives, or production decryption key.
